version: 2
updates:
  # Swift Package Manager dependencies of the generator
  - package-ecosystem: "swift"
    directory: "/swift-generator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
