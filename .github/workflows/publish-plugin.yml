name: Publish Plugin

# Publishes only the Gradle plugin of a released version, from its tag. The
# release workflow cannot be re-run for this once Maven Central has the version,
# so this covers a plugin submission the Gradle Plugin Portal canceled, such as
# a first version flagged for manual review.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish, such as v1.0.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-plugin:
    # macOS builds the generator bundled in the plugin's jar.
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "'$TAG' is not a version tag such as v1.0.0" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the version
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match VERSION_NAME ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Test the plugin
        run: ./gradlew :kmp-swift-mockable-gradle-plugin:check

      - name: Check that the plugin bundles the generator
        run: |
          ./gradlew :kmp-swift-mockable-gradle-plugin:jar
          unzip -l "gradle-plugin/build/libs/kmp-swift-mockable-gradle-plugin-${VERSION}.jar" > plugin-jar.txt
          grep -q 'kmp-swift-mockable/generator/kmp-swift-mockable-generator' plugin-jar.txt

      - name: Publish the Gradle plugin to the Gradle Plugin Portal
        run: ./gradlew :kmp-swift-mockable-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
