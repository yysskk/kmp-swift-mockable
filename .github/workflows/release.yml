name: Release

# Publishes a release when a version tag such as v1.0.0 is pushed. The tag must
# match VERSION_NAME in gradle.properties. See "Releasing" in CONTRIBUTING.md for
# the secrets this needs.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # macOS builds the generator bundled in the plugin's jar, and the Apple targets
    # of the annotation.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the version
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Prepared before anything is published, so that a missing changelog section
      # stops the release instead of leaving it half done.
      - name: Extract the release notes from the changelog
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi

      - name: Test
        run: ./gradlew check

      - name: Check that the plugin bundles the generator
        run: |
          ./gradlew :kmp-swift-mockable-gradle-plugin:jar
          unzip -l "gradle-plugin/build/libs/kmp-swift-mockable-gradle-plugin-${VERSION}.jar" > plugin-jar.txt
          grep -q 'kmp-swift-mockable/generator/kmp-swift-mockable-generator' plugin-jar.txt

      - name: Publish the annotation and the processor to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Publish the Gradle plugin to the Gradle Plugin Portal
        run: ./gradlew :kmp-swift-mockable-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
