name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The generator parses and prints Swift source only, so everything except
  # running the interface synthesizer is tested on Linux as well.
  generator-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift-version: ['6.2', '6.3', '6.4']
    container: swift:${{ matrix.swift-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        working-directory: swift-generator
        run: swift build

      # Runs the suite with coverage enabled and exports coverage.lcov.
      - name: Run tests
        run: scripts/export-coverage.sh

  generator-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"

      - name: Show Swift version
        run: swift --version

      - name: Build
        working-directory: swift-generator
        run: swift build

      - name: Run tests
        run: scripts/export-coverage.sh

      # Both generator jobs export a report, but the two platforms exercise
      # nearly the same lines, so the macOS one is uploaded.
      #
      # Pull requests from forks cannot read CODECOV_TOKEN, so they skip the
      # upload instead of failing over a secret they were never given. Pushes
      # to main still upload, which is what later pull requests compare against.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          flags: generator
          disable_search: true
          fail_ci_if_error: true

  # Apple targets compile only on macOS; Linux checks every other target and the
  # JVM modules.
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check koverXmlReport

      # The JVM modules run the same tests on both hosts, so one upload is enough.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: kotlin
          disable_search: true
          fail_ci_if_error: true

  # Builds the sample's framework with the plugin, as an app would, and runs Swift
  # tests that drive Kotlin code with the generated mocks.
  sample:
    runs-on: macos-latest
    env:
      GENERATED: sample/swift/Tests/SharedTests/Generated/SharedMocks.swift
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the framework and generate the mocks
        run: ./gradlew -p sample assembleSharedDebugXCFramework

      - name: Compare the generated mocks with the snapshot
        run: diff -u sample/SharedMocks.swift.expected "$GENERATED"

      - name: Run the Swift tests
        run: swift test --package-path sample/swift

      - name: Check that an unchanged build leaves the mocks alone
        run: |
          before="$(stat -f %m "$GENERATED")"
          ./gradlew -p sample assembleSharedDebugXCFramework --console=plain | tee build.log
          grep -q ":shared:generateSwiftMocksDebugFrameworkIosSimulatorArm64 UP-TO-DATE" build.log
          test "$before" = "$(stat -f %m "$GENERATED")"

  test:
    runs-on: ubuntu-latest
    needs: [generator-linux, generator-macos, gradle, sample]
    if: always()
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs['generator-linux'].result }}" != "success" ] || [ "${{ needs['generator-macos'].result }}" != "success" ] || [ "${{ needs.gradle.result }}" != "success" ] || [ "${{ needs.sample.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          echo "All builds passed"
